<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .option.correct { background-color: #16a34a !important; color: white; }
    .option.wrong { background-color: #dc2626 !important; color: white; }
    .glass { backdrop-filter: blur(10px); background: rgba(255,255,255,0.04); }
    .option.selected { ring: 2px; ring-yellow-400; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 flex justify-center">

  <div class="w-full max-w-xl">

    <!-- USER INFO SECTION -->
    <div id="userInfo" class="bg-gradient-to-br from-white to-purple-200 text-black p-6 rounded-2xl shadow-xl space-y-4">
      <h2 class="text-3xl font-bold text-purple-700 text-center flex items-center justify-center gap-2">
        👤 Your Info
      </h2>
      <input id="nameInput" class="w-full p-3 rounded-xl border border-purple-400 focus:ring-2 ring-purple-500 outline-none" placeholder="Enter your name..." />
      <button id="startBtn" class="bg-purple-600 hover:bg-purple-500 text-white w-full py-3 rounded-xl font-semibold text-lg">Let's Start Quiz</button>
    </div>

    <!-- QUIZ SECTION -->
    <div id="quizSection" class="hidden mt-8 space-y-4 glass p-6 rounded-2xl">
      <div class="flex justify-between items-center">
        <div class="font-semibold"> <span id="progressText"></span> </div>
        <div id="profileDisplay" class="text-sm text-purple-200 font-medium hidden">👤 <span id="profileName"></span></div>
      </div>

      <div id="questionBox">
        <!-- question + options injected here -->
      </div>

      <div class="flex justify-between mt-4">
        <button id="prevBtn" class='bg-gray-600 px-4 py-2 rounded-xl'>&larr; Prev</button>
        <div class="flex gap-2">
          <button id="checkBtn" class='bg-green-600 px-4 py-2 rounded-xl'>Check</button>
          <button id="nextBtn" class='bg-blue-600 px-4 py-2 rounded-xl'>Next &rarr;</button>
        </div>
      </div>
    </div>

    <!-- RESULT SECTION -->
    <div id="resultSection" class="hidden bg-gray-800 p-6 rounded-2xl text-center mt-8 space-y-3">
      <h2 class="text-3xl font-bold">🎉 Quiz Completed!</h2>
      <p id="finalScore" class="text-xl font-semibold"></p>
      <div id="finalScoreBox" class="mt-4 bg-gradient-to-r from-green-500 to-green-400 text-white font-bold p-4 rounded-xl"></div>
      <button id="restartBtn" class="bg-blue-600 hover:bg-blue-500 text-white w-full py-3 rounded-xl font-semibold text-lg">Restart Quiz</button>
    </div>
  </div>

<script>
// QUESTIONS
const questions = [
  { q: "What does HTML stand for?", options: ["Hyper Trainer Marking Language", "Hyper Text Markup Language", "High Text Making Language", "None"], answer: 1 },
  { q: "CSS is used for?", options: ["Styling", "Backend", "Database", "Networking"], answer: 0 },
  { q: "JS stands for?", options: ["JavaStarter", "JavaScript", "JustScript", "JumboSystem"], answer: 1 },
  { q: "Which tag is for images?", options: ["<img>", "<image>", "<picture>", "<photo>"], answer: 0 },
  { q: "Which company created JavaScript?", options: ["Google", "Microsoft", "Netscape", "Amazon"], answer: 2 },
  { q: "React is a?", options: ["Backend", "Library", "Language", "Database"], answer: 1 },
  { q: "Tailwind is a?", options: ["CSS Framework", "JS Library", "Backend", "Compiler"], answer: 0 },
  { q: "2 + 2 =?", options: ["3","4","22","5"], answer: 1 },
  { q: "Which is not a programming language?", options: ["Python","HTML","C++","Java"], answer: 1 },
  { q: "DOM stands for?", options: ["Document Object Model","Data Object Mark","Design Object Map","Download Object Model"], answer: 0 },
  { q: "Which is CSS framework?", options: ["Bootstrap","React","Node","MongoDB"], answer: 0 },
  { q: "Which is database?", options: ["CSS","MongoDB","HTML","Bootstrap"], answer: 1 },
  { q: "JS file extension?", options: [".script",".javascript",".js",".jv"], answer: 2 },
  { q: "Which tag creates a link?", options: ["<a>","<link>","<goto>","<href>"], answer: 0 },
  { q: "Full form of API?", options: ["App Processing Interface","Application Programming Interface","Applied Program Info","None"], answer: 1 },
  { q: "Which stores data in browser?", options: ["CPU","RAM","LocalStorage","GPU"], answer: 2 },
  { q: "Which is JS framework?", options: ["Laravel","React","Django","Flask"], answer: 1 },
  { q: "Which is NoSQL DB?", options: ["MongoDB","MySQL","PostgreSQL","SQLServer"], answer: 0 },
  { q: "Who invented the Web?", options: ["Bill Gates","Tim Berners-Lee","Elon Musk","Mark"], answer: 1 },
  { q: "1+1=?", options: ["1","2","3","4"], answer: 1 },
  { q: "Capital of India?", options: ["Mumbai","Delhi","Kolkata","Chennai"], answer: 1 },
  { q: "Color of sky?", options: ["Blue","Red","Green","Pink"], answer: 0 },
  { q: "SSD stands for?", options: ["Solid State Drive","Super Speed Disk","Soft Storage Device","None"], answer: 0 },
  { q: "Keyboard key?", options: ["Shift","Screen","Fan","Cable"], answer: 0 },
  { q: "Mouse is?", options: ["Output","Input","Both","None"], answer: 1 },
  { q: "JS type?", options: ["Static","Dynamic","Manual","Hybrid"], answer: 1 },
  { q: "Sun rises from?", options: ["East","West","North","South"], answer: 0 },
  { q: "React uses?", options: ["JSX","PHP","Python","Ruby"], answer: 0 },
  { q: "Google CEO?", options: ["Sundar Pichai","Bill Gates","Mukesh","Elon"], answer: 0 },
  { q: "Which is fastest land animal?", options: ["Cheetah","Lion","Tiger","Leopard"], answer: 0 }
];

// GLOBAL VARIABLES
let picked = [];
let currentIndex = 0;
let score = 0;
let userName = "";
let userAnswers = []; // store selected index per question or null

// ELEMENTS
const startBtn = document.getElementById('startBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const checkBtn = document.getElementById('checkBtn');
const restartBtn = document.getElementById('restartBtn');

startBtn.addEventListener('click', startQuiz);
prevBtn.addEventListener('click', prevQuestion);
nextBtn.addEventListener('click', nextQuestion);
checkBtn.addEventListener('click', checkCurrentAnswer);
restartBtn.addEventListener('click', restartQuiz);

// FUNCTIONS
function startQuiz() {
  userName = document.getElementById("nameInput").value.trim();
  if (!userName) return alert("Please enter your name!");

  document.getElementById("userInfo").classList.add("hidden");
  document.getElementById("quizSection").classList.remove("hidden");
  document.getElementById('profileDisplay').classList.remove('hidden');
  document.getElementById('profileName').innerText = userName;

  picked = [...questions].sort(() => Math.random() - 0.5); // shuffle
  userAnswers = Array(picked.length).fill(null);
  currentIndex = 0;
  score = 0;

  showQuestion();
}

function renderProgress() {
  document.getElementById('progressText').innerText = `Question ${currentIndex + 1} / ${picked.length}`;
}

function showQuestion() {
  renderProgress();
  const q = picked[currentIndex];

  const optionsHtml = q.options.map((opt, i) => {
    return `<button data-index="${i}" class="option w-full p-3 bg-gray-700 rounded-xl text-left font-medium hover:bg-gray-600 mb-2">${escapeHtml(opt)}</button>`;
  }).join('');

  document.getElementById('questionBox').innerHTML = `
    <h2 class='text-xl font-semibold mb-4'>Q${currentIndex + 1}: ${escapeHtml(q.q)}</h2>
    <div id='optionsWrap'>${optionsHtml}</div>
  `;

  // attach handlers
  document.querySelectorAll('#optionsWrap .option').forEach(btn => {
    btn.addEventListener('click', () => {
      selectOption(Number(btn.getAttribute('data-index')));
    });
  });

  // show previous selection if exists
  const prev = userAnswers[currentIndex];
  if (prev !== null) {
    markAnswer(prev);
  }

  prevBtn.disabled = currentIndex === 0;
}

function selectOption(idx) {
  userAnswers[currentIndex] = idx;
  markAnswer(idx);
}

function markAnswer(idx) {
  document.querySelectorAll('#optionsWrap .option').forEach(b => b.classList.remove('ring-2','ring-yellow-400'));
  const el = document.querySelector(`#optionsWrap .option[data-index='${idx}']`);
  if (el) el.classList.add('ring-2','ring-yellow-400');
}

function checkCurrentAnswer() {
  const q = picked[currentIndex];
  const selected = userAnswers[currentIndex];
  const options = document.querySelectorAll(".option");

  if (selected === null) return alert("Select an option first.");

  options.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    if (i === selected && i !== q.answer) btn.classList.add('wrong');
  });

  // update score
  score = userAnswers.reduce((acc, ans, idx) => (ans === picked[idx].answer ? acc + 1 : acc), 0);
}

function nextQuestion() {
  if (currentIndex < picked.length - 1) {
    currentIndex++;
    showQuestion();
  } else {
    finishQuiz();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    showQuestion();
  }
}

function finishQuiz() {
  document.getElementById('quizSection').classList.add('hidden');
  document.getElementById('resultSection').classList.remove('hidden');
  document.getElementById('finalScore').innerText = `${userName}, your quiz is completed!`;
  document.getElementById('finalScoreBox').innerText = `Your Final Score: ${score} / ${picked.length}`;
}

function restartQuiz() {
  location.reload();
}

function escapeHtml(unsafe) {
  return unsafe
       .replace(/&/g, "&amp;")
       .replace(/</g, "&lt;")
       .replace(/>/g, "&gt;")
       .replace(/\"/g, "&quot;")
       .replace(/'/g, "&#039;");
}
</script>
</body>
</html>

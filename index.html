<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .option.correct { background-color: #16a34a !important; color: white; }
    .option.wrong { background-color: #dc2626 !important; color: white; }
    .glass { backdrop-filter: blur(10px); background: rgba(255,255,255,0.04); }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 flex justify-center">

  <div class="w-full max-w-xl">

    <!-- USER INFO SECTION -->
    <div id="userInfo" class="bg-gradient-to-br from-white to-purple-200 text-black p-6 rounded-2xl shadow-xl space-y-4">
      <h2 class="text-3xl font-bold text-purple-700 text-center flex items-center justify-center gap-2">
        👤 Your Info
      </h2>
      <input id="nameInput" class="w-full p-3 rounded-xl border border-purple-400 focus:ring-2 ring-purple-500 outline-none" placeholder="Enter your name..." />
      <button id="startBtn" class="bg-purple-600 hover:bg-purple-500 text-white w-full py-3 rounded-xl font-semibold text-lg">Let's Start Quiz</button>
    </div>

    <!-- QUIZ SECTION -->
    <div id="quizSection" class="hidden mt-8 space-y-4 glass p-6 rounded-2xl">
      <div class="flex justify-between items-center">
        <div class="font-semibold"> <span id="progressText"></span> </div>
        <div id="profileDisplay" class="text-sm text-purple-200 font-medium hidden">👤 <span id="profileName"></span></div>
      </div>

      <div id="questionBox">
        <!-- question + options injected here -->
      </div>

      <div class="flex justify-between mt-4">
        <button id="prevBtn" class='bg-gray-600 px-4 py-2 rounded-xl'>&larr; Prev</button>
        <div class="flex gap-2">
          <button id="checkBtn" class='bg-green-600 px-4 py-2 rounded-xl'>Check</button>
          <button id="nextBtn" class='bg-blue-600 px-4 py-2 rounded-xl'>Next &rarr;</button>
        </div>
      </div>
    </div>

    <!-- RESULT SECTION -->
    <div id="resultSection" class="hidden bg-gray-800 p-6 rounded-2xl text-center mt-8 space-y-3">
      <h2 class="text-3xl font-bold">🎉 Quiz Completed!</h2>
      <p id="finalScore" class="text-xl font-semibold"></p>
      <div id="finalScoreBox" class="mt-4 bg-gradient-to-r from-green-500 to-green-400 text-white font-bold p-4 rounded-xl"></div>
      <button id="restartBtn" class="bg-blue-600 hover:bg-blue-500 text-white w-full py-3 rounded-xl font-semibold text-lg">Restart Quiz</button>
    </div>
  </div>

<script>
let questions = [
  { q: "What does HTML stand for?", options: ["Hyper Trainer Marking Language", "Hyper Text Markup Language", "High Text Making Language", "None"], answer: 1 },
  { q: "CSS is used for?", options: ["Styling", "Backend", "Database", "Networking"], answer: 0 },
  { q: "JS stands for?", options: ["JavaStarter", "JavaScript", "JustScript", "JumboSystem"], answer: 1 }
];

let picked = [];
let currentIndex = 0;
let score = 0;
let userName = "";

function startQuiz() {
  userName = document.getElementById("nameInput").value.trim();
  if (!userName) return alert("Please enter your name!");

  document.getElementById("userInfo").classList.add("hidden");
  document.getElementById("quizSection").classList.remove("hidden");

  shuffled = [...questions].sort(() => Math.random() - 0.5);
  picked = shuffled.slice(0, questions.length); // FIXED

  showQuestion();
}

function showQuestion() {
  if (currentIndex >= picked.length) return finishQuiz();

  const q = picked[currentIndex];
  document.getElementById("quizSection").innerHTML = `
    <h2 class='text-xl font-semibold'>Q${currentIndex + 1}: ${q.q}</h2>
    <div class='space-y-3'>
      ${q.options
        .map((opt, i) => `
        <button onclick="checkAnswer(${i})" class="option w-full p-3 bg-gray-700 rounded-xl text-left font-medium hover:bg-gray-600">${opt}</button>
      `)
        .join("")}
    </div>
    <div class='flex justify-between mt-4'>
      <button onclick="prevQuestion()" class='px-4 py-2 bg-gray-600 rounded-xl'>⬅ Prev</button>
      <button onclick="nextQuestion()" class='px-4 py-2 bg-blue-600 rounded-xl'>Next ➡</button>
    </div>
  `;
}

function checkAnswer(i) {
  const q = picked[currentIndex];
  const options = document.querySelectorAll(".option");

  if (i === q.answer) {
    options[i].classList.add("correct");
    score++;
  } else {
    options[i].classList.add("wrong");
    options[q.answer].classList.add("correct");
  }

  options.forEach(btn => (btn.disabled = true));
}

function nextQuestion() {
  currentIndex++;
  showQuestion();
}

function prevQuestion() {
  if (currentIndex > 0) currentIndex--;
  showQuestion();
}

function finishQuiz() {
  document.getElementById("quizSection").classList.add("hidden");
  document.getElementById("resultSection").classList.remove("hidden");

  document.getElementById("finalScore").innerText = `Hey ${userName} 👋, You got ${score} out of ${picked.length}!`;
}

function restartQuiz() {
  location.reload();
}
</script>

</body>
</html>
